<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patlu Boss AI</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        .container { width: 100%; max-width: 600px; background: #1e293b; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h1 { text-align: center; color: #38bdf8; font-size: 24px; margin-bottom: 20px; }
        .chat-box { height: 350px; background: #0f172a; border-radius: 8px; padding: 15px; overflow-y: auto; margin-bottom: 15px; border: 1px solid #334155; }
        .input-group { display: flex; gap: 10px; }
        input, button { padding: 12px; border-radius: 6px; border: none; font-size: 16px; }
        input { flex: 1; background: #334155; color: #fff; }
        button { background: #38bdf8; color: #0f172a; font-weight: bold; cursor: pointer; }
        button:hover { background: #0ea5e9; }
        .message { margin-bottom: 10px; padding: 8px 12px; border-radius: 6px; max-width: 80%; }
        .user-msg { background: #0284c7; margin-left: auto; text-align: right; }
        .ai-msg { background: #475569; margin-right: auto; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Patlu Boss AI Dashboard</h1>
        <div class="chat-box" id="chatBox">
            <div class="message ai-msg">नमस्ते इस्लाम भाई! Patlu Boss AI तैयार है। बताइए क्या काम करना है?</div>
        </div>
        <div class="input-group">
            <input type="text" id="userInput" placeholder="यहाँ अपना सवाल या कमांड लिखें..." />
            <button onclick="sendMessage()">भेजें</button>
        </div>
    </div>

    <script>
        function sendMessage() {
            const input = document.getElementById('userInput');
            const chatBox = document.getElementById('chatBox');
            if (!input.value.trim()) return;

            // User Message
            const userDiv = document.createElement('div');
            userDiv.className = 'message user-msg';
            userDiv.textContent = input.value;
            chatBox.appendChild(userDiv);

            const query = input.value;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // AI Response simulation (OpenAI API connection placeholder)
            setTimeout(() => {
                const aiDiv = document.createElement('div');
                aiDiv.className = 'message ai-msg';
                aiDiv.textContent = "भाई, आपका कमांड मिल गया है: " + query + "। इसे प्रोसेस किया जा रहा है!";
                chatBox.appendChild(aiDiv);
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 1000);
        }
    </script>
</body>
</html>
